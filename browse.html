
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/browse.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">CampusFind</a>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="report.html">Report an Item</a>
                <a href="browse.html">Browse Items</a>
                <a href="index.html">Home</a>
            </nav>
        </div>
    </header>

    <main class="browse-container">

        <section class="browse-heading">
            <h1>Browse Items</h1>
            <p>Explore lost and found items reported on campus.</p>
        </section>

        <section class="filter-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by item name or description..."
            >

            <select id="typeFilter">
                <option value="All">All Items</option>
                <option value="Lost">Lost Items</option>
                <option value="Found">Found Items</option>
            </select>

            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Books & Notes">Books & Notes</option>
                <option value="ID Cards">ID Cards</option>
                <option value="Bags">Bags</option>
                <option value="Clothing">Clothing</option>
                <option value="Accessories">Accessories</option>
                <option value="Other">Other</option>
            </select>

        </section>

<!-- Smart Matching Section -->
<section class="smart-match-section">
    <div class="smart-match-heading">
        <h2>✨ Possible Matches</h2>
        <p>CampusFind automatically checks for similar lost and found items.</p>
    </div>

    <div id="smartMatchesContainer" class="smart-matches-grid">
        <!-- Matching items will appear here -->
    </div>

    <p id="noMatchesMessage">
        No possible matches found right now.
    </p>
</section>

        <p id="resultsCount"></p>

        <section id="itemsContainer" class="items-grid">
            <!-- Item cards will appear here using JavaScript -->
        </section>

        <p id="emptyMessage" style="display: none;">
            No matching items found.
        </p>

    </main>

    <script src="js/auth.js"></script>
    <script>
        protectPage();
    </script>
    <script src="js/browse.js"></script>

</body>
</html>
