
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusFind</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="brand">⌕ CampusFind</a>

        <div class="auth-card">
            <h1>Welcome Back!</h1>
            <p class="subtitle">Log in to your CampusFind account.</p>

            <form id="loginForm">
                <label for="email">College Email</label>
                <input type="email" id="email"
                       placeholder="Enter your college email" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>

                <p id="loginError" class="message error"></p>

                <button type="submit" class="auth-button">
                    Log In
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
